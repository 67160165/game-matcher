<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สมัครสมาชิก - GameMatch</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="container">
    <div class="card card-narrow">
      <h2>สมัครสมาชิก</h2>
      <p class="subtitle">สร้างบัญชีเพื่อบันทึกผลการจับคู่เกมของคุณ</p>

      <div id="alert-box"></div>

      <form id="register-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="3-20 ตัวอักษร (a-z, 0-9, _)" required />
          <div id="username-hint" class="hint"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">สมัครสมาชิก</button>
      </form>

      <p class="subtitle center mt-24">มีบัญชีอยู่แล้ว? <a href="/login.html" style="color: var(--accent);">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const usernameInput = document.getElementById('username');
    const hint = document.getElementById('username-hint');
    let debounceTimer;

    usernameInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const name = usernameInput.value.trim();
      if (name.length < 3) { hint.textContent = ''; return; }
      debounceTimer = setTimeout(async () => {
        try {
          const data = await apiRequest(`/check-username/${encodeURIComponent(name)}`);
          hint.textContent = data.available ? '✓ username นี้ใช้ได้' : '✗ username นี้ถูกใช้แล้ว';
          hint.className = 'hint ' + (data.available ? 'ok' : 'bad');
        } catch (e) { hint.textContent = ''; }
      }, 400);
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('submit-btn');
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังสมัคร...';

      try {
        const body = {
          username: document.getElementById('username').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        };
        const data = await apiRequest('/register', { method: 'POST', body });
        setSession(data.token, data.user);
        window.location.href = '/quiz.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'สมัครสมาชิก';
      }
    });
  </script>
</body>
</html>
