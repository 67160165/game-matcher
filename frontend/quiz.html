<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ทำแบบทดสอบหาเกม - GameMatch</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .quiz-card {
    max-width: 780px;
    margin: 24px auto;
    position: relative;
    padding: 28px !important;
  }
  .quiz-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .step-badge {
    font-size: 0.85rem;
    font-weight: 600;
    color: #c4b5fd;
    background: rgba(139, 92, 246, 0.18);
    border: 1px solid rgba(139, 92, 246, 0.35);
    padding: 5px 14px;
    border-radius: 999px;
  }
  .btn-surprise {
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-surprise:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }
  /* แถบปุ่มกดข้ามข้อ 1 - 8 */
  .step-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .step-pill {
    flex: 1;
    min-width: 68px;
    padding: 7px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim, #9ca3af);
    font-size: 0.76rem;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .step-pill:hover {
    border-color: rgba(139, 92, 246, 0.45);
    color: #fff;
  }
  .step-pill.active {
    background: rgba(139, 92, 246, 0.24);
    border-color: #8b5cf6;
    color: #fff;
    font-weight: 600;
  }
  .step-pill.done {
    border-color: rgba(16, 185, 129, 0.4);
    color: #6ee7b7;
  }
  .quiz-question-title {
    font-size: 1.4rem;
    margin: 10px 0 4px;
  }
  .quiz-question-sub {
    color: var(--text-dim, #9ca3af);
    font-size: 0.92rem;
    margin-bottom: 18px;
  }
  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
    animation: fadeIn 0.22s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .option-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border, rgba(255,255,255,0.1));
    background: rgba(255, 255, 255, 0.025);
    cursor: pointer;
    text-align: left;
    transition: all 0.16s ease;
    color: inherit;
    position: relative;
  }
  .option-card:hover {
    border-color: rgba(139, 92, 246, 0.6);
    background: rgba(139, 92, 246, 0.08);
    transform: translateY(-2px);
  }
  .option-card.selected {
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.2);
    box-shadow: 0 0 0 1px #8b5cf6, 0 8px 20px rgba(139, 92, 246, 0.18);
  }
  .option-check {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #8b5cf6;
    color: #fff;
    font-size: 0.72rem;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .option-card.selected .option-check {
    display: flex;
  }
  .option-icon {
    font-size: 1.6rem;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .option-title {
    font-weight: 600;
    font-size: 0.95rem;
    display: block;
    margin-bottom: 3px;
    padding-right: 18px;
  }
  .option-desc {
    font-size: 0.78rem;
    color: var(--text-dim, #9ca3af);
    line-height: 1.38;
    display: block;
  }
  /* กล่อง Slider ปรับราคาและปีแบบละเอียด */
  .slider-panel {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .slider-val-badge {
    font-size: 1.05rem;
    font-weight: 700;
    color: #f472b6;
    background: rgba(236, 72, 153, 0.14);
    padding: 4px 14px;
    border-radius: 999px;
  }
  .range-input {
    width: 100%;
    accent-color: #8b5cf6;
    cursor: pointer;
    height: 6px;
  }
  .slider-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-dim, #9ca3af);
    margin-top: 6px;
  }
  /* ช่องพิมพ์คำค้นพิเศษ */
  .custom-input-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .custom-input-box input {
    width: 100%;
    margin-top: 8px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(11, 13, 23, 0.7);
    color: #fff;
    font-size: 0.95rem;
  }
  .quick-kw-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .kw-chip {
    font-size: 0.76rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(139, 92, 246, 0.14);
    border: 1px solid rgba(139, 92, 246, 0.35);
    color: #ddd6fe;
    cursor: pointer;
  }
  .kw-chip:hover {
    background: rgba(139, 92, 246, 0.32);
  }
  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 14px 0 6px;
    padding-top: 12px;
    border-top: 1px solid var(--border, rgba(255,255,255,0.08));
  }
  .summary-chip {
    font-size: 0.76rem;
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(139, 92, 246, 0.14);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #e5e7eb;
  }
  .loading-box {
    text-align: center;
    padding: 44px 20px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(139, 92, 246, 0.2);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="container">
    <div class="card quiz-card">
      <div class="quiz-top-bar">
        <span id="step-indicator" class="step-badge">คำถามที่ 1 / 8</span>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-outline" id="reset-btn" style="padding:6px 12px; font-size:0.8rem;">ล้างค่า</button>
          <button type="button" class="btn-surprise" id="surprise-btn">🎲 สุ่มสเปกให้ฉัน (Surprise Me)</button>
        </div>
      </div>

      <div id="step-pills" class="step-pills"></div>

      <div class="quiz-progress" style="margin-bottom: 18px;">
        <div class="quiz-progress-bar" id="progress-bar" style="width:0%"></div>
      </div>

      <div id="quiz-body">กำลังโหลดคำถาม...</div>

      <div id="summary-bar" class="summary-strip" style="display:none;"></div>

      <div class="quiz-actions" id="quiz-actions" style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px;">
        <button class="btn btn-outline" id="back-btn">← ย้อนกลับ</button>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline" id="skip-btn" style="opacity:0.85;">ข้ามข้อนี้</button>
          <button class="btn btn-primary" id="next-btn">ถัดไป →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>
